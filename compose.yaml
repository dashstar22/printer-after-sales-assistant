name: java-ai-printer-mvp
services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-printer_after_sales}
      MYSQL_USER: ${MYSQL_USER:-printer_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 backend/.env 配置应用数据库密码}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 backend/.env 配置独立 root 密码}
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
volumes:
  mysql-data:
  qdrant-data:
