<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100c1c">
  <title>纸序 · 售后服务</title>
  <link rel="icon" href="./assets/brand.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/fonts/noto-sans-sc.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#entry">跳到服务入口</a>
  <div class="scene" id="scene">
    <div class="atmosphere" aria-hidden="true"><img class="portrait" src="./assets/service-background.svg" width="3840" height="2160" alt="" fetchpriority="high"><div class="shade"></div><div class="ambient-light"></div><div id="particles-far" class="particle-field"></div><div id="particles-near" class="particle-field particle-near"></div></div>
    <header class="header">
      <a class="brand" href="./" aria-label="纸序服务首页"><img src="./assets/brand.svg" width="26" height="29" alt="">纸序</a>
      <span class="header-product">打印机售后服务中心</span>
      <nav class="nav" id="navigation" aria-label="服务导航" hidden></nav>
      <div class="header-actions"><span id="identity" class="identity"></span><button id="logout" class="quiet-button" type="button" hidden>退出登录</button></div>
    </header>
    <main id="main">
      <section class="hero-copy" aria-labelledby="hero-title"><p class="service-label">纸序 · 服务始终有序</p><h1 id="hero-title"><span class="line-window"><span class="title-line">设备有问题，</span></span><span class="line-window"><span class="title-line">服务有着落。</span></span></h1><p class="hero-description">查询设备、咨询故障、提交报修。<br>每一步处理，都有迹可循。</p><div class="hero-features"><span>AI 辅助咨询</span><span>在线报修</span><span>进度跟踪</span></div></section>
      <div class="entry-region"><section class="entry-card" id="entry" tabindex="-1" aria-live="polite" aria-busy="true"><h2>正在核对登录状态…</h2><p class="card-copy">请稍候。</p><progress aria-label="正在核对登录状态"></progress></section>
      <p class="entry-note">客户与客服使用同一入口，登录后进入各自的服务空间。</p></div>
      <section id="workspace" class="workspace" hidden tabindex="-1" aria-label="售后服务空间"></section>
    </main>
    <footer class="footer"><span>纸序 · 打印机售后服务</span><span>设备有问题，服务有着落。</span></footer>
  </div>

  <template id="login-view"><div data-view="login"><div class="card-heading"><h2>登录售后服务</h2><span class="section-note">欢迎回来，请登录你的账号</span></div><form id="login-form"><div class="fields"><div class="field"><label for="username">账号</label><input id="username" name="username" autocomplete="username" maxlength="100" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div></div><div class="login-options"><label><input id="remember-account" type="checkbox">记住账号</label><label><input id="auto-login" name="remember-me" type="checkbox">14 天内自动登录</label></div><p id="login-feedback" class="feedback" role="alert" hidden></p><div class="card-actions"><button class="primary-button" id="login-submit" type="submit">登录服务中心<img src="./assets/icons/arrow-up-right.svg" width="16" height="16" alt=""></button></div></form><p class="auth-switch">还没有账号？<a id="open-registration" href="#/register">创建账号</a></p></div></template>
  <template id="register-view"><div data-view="register"><div class="card-heading"><h2>创建客户账号</h2></div><form id="register-form"><div class="fields"><div class="field"><label for="register-username">账号</label><input id="register-username" name="username" autocomplete="username" minlength="4" maxlength="32" pattern="[A-Za-z0-9_]{4,32}" placeholder="4–32 位字母、数字或下划线" required></div><div class="field"><label for="register-password">密码</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="64" placeholder="8–64 位字符" required></div><div class="field"><label for="register-password-confirmation">确认密码</label><input id="register-password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="64" placeholder="再次输入密码" required></div></div><p id="register-feedback" class="feedback" role="alert" hidden></p><div class="card-actions"><button class="primary-button" id="register-submit" type="submit">创建账号</button></div></form><p class="auth-switch">已有账号？<a id="back-to-login" href="#/login">立即登录</a></p></div></template>
  <template id="customer-view"><div data-view="customer"><div class="card-heading"><h2>客户服务</h2><span class="role-label">客户</span></div><p class="welcome">欢迎回来，<strong data-username></strong></p><p class="card-copy">咨询设备问题、核对报修内容，或查看处理进度。</p><div class="card-actions"><button class="text-button" data-refresh type="button">核对当前身份</button><a class="primary-button" href="#/customer/assistant">进入售后服务<img src="./assets/icons/arrow-up-right.svg" width="16" height="16" alt=""></a></div></div></template>
  <template id="staff-view"><div data-view="staff"><div class="card-heading"><h2>客服工作台</h2><span class="role-label">客服</span></div><p class="welcome">你好，<strong data-username></strong></p><p class="card-copy">查看企业工单，跟进设备问题与处理结果。</p><div class="card-actions"><button class="text-button" data-refresh type="button">核对当前身份</button><a class="primary-button" href="#/staff/tickets">打开工单工作台<img src="./assets/icons/arrow-up-right.svg" width="16" height="16" alt=""></a></div></div></template>
  <template id="message-view"><div data-view="message"><h2 data-heading></h2><p class="card-copy" data-message></p><p class="feedback" data-detail hidden></p><div class="card-actions"><span></span><button class="primary-button" data-retry type="button">重新核对身份<img src="./assets/icons/rotate-ccw.svg" width="16" height="16" alt=""></button><a class="primary-button" data-home hidden>返回我的入口<img src="./assets/icons/arrow-up-right.svg" width="16" height="16" alt=""></a></div></div></template>
  <noscript><p class="no-script">请启用 JavaScript 以核对登录身份。也可以打开<a href="/repair/">普通报修入口</a>。</p></noscript>
  <script src="./vendor/motion-14.9.0.js"></script>
  <script src="./vendor/tsparticles-basic-4.5.0.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
